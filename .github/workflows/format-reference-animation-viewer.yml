name: One-time Reference Animation Viewer Formatter

on:
  push:
    branches:
      - ci/reference-animation-viewer-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib test
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib test pubspec.lock; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test pubspec.lock
          git commit -m "style: format reference animation and viewer"
          git push origin HEAD:ci/reference-animation-viewer-format
