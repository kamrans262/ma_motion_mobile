name: MA Temporary Filter Format Preview
on:
  push:
    branches:
      - feature/maker-onboarding-ui-polish
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Capture canonical filter formatting
        shell: bash
        run: |
          dart format lib/features/discovery/presentation/screens/discovery_filter_screen.dart test/features/discovery/discovery_filter_screen_test.dart test/features/onboarding/ma_type_style_visual_contract_test.dart
          echo MA_FILTER_SOURCE_START
          cat lib/features/discovery/presentation/screens/discovery_filter_screen.dart
          echo MA_FILTER_SOURCE_END
          echo MA_FILTER_TEST_START
          cat test/features/discovery/discovery_filter_screen_test.dart
          echo MA_FILTER_TEST_END
          echo MA_CHIP_TEST_START
          cat test/features/onboarding/ma_type_style_visual_contract_test.dart
          echo MA_CHIP_TEST_END
