name: MA Temp Format Onboarding Tests
on:
  push:
    branches:
      - feature/maker-onboarding-ui-polish
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Capture formatter output
        shell: bash
        run: |
          dart format test/features/onboarding/maker_registration_flow_test.dart test/features/onboarding/onboarding_validators_test.dart
          echo MA_MAKER_START
          cat test/features/onboarding/maker_registration_flow_test.dart
          echo MA_MAKER_END
          echo MA_VALIDATORS_START
          cat test/features/onboarding/onboarding_validators_test.dart
          echo MA_VALIDATORS_END
