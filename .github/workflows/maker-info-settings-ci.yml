name: Maker Info Settings Mobile CI

on:
  push:
    branches:
      - ci/maker-info-settings
      - feature/maker-onboarding-ui-polish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout module branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get

          fi

      - name: Generate MA Motion launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify generated launcher icons are current
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pubspec.lock android/app/src/main/res ios/Runner/Assets.xcassets/AppIcon.appiconset

      - name: Focused video changes analyzer and tests
        shell: bash
        run: |
          set -euo pipefail
          dart analyze lib/features/auth/domain/current_user.dart
          dart analyze lib/core/routing/app_router.dart
          dart analyze lib/features/settings/presentation/widgets/ma_settings_dialogs.dart
          dart analyze lib/features/settings/presentation/widgets/appreciator_settings_modal.dart
          dart analyze lib/features/settings/data/maker_info_settings_repository.dart
          dart analyze lib/features/settings/domain/maker_info_settings_models.dart
          dart analyze lib/features/settings/presentation/screens/maker_info_settings_screen.dart
          dart analyze lib/features/artwork_viewer/presentation/widgets/artwork_video_surface.dart
          dart analyze lib/features/artwork_viewer/presentation/screens/artwork_viewer_screen.dart
          dart analyze lib/features/discovery/presentation/widgets/discovery_artwork_tile.dart
          flutter test test/features/settings/maker_info_settings_repository_test.dart
          flutter test test/features/settings/maker_info_settings_screen_test.dart
          flutter test test/features/artwork_viewer/artwork_viewer_screen_test.dart
          flutter test test/features/settings/ma_settings_dialogs_test.dart

      - name: Verify formatting is stable
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyzer
        run: flutter analyze

      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Android dependency metadata gate
        run: gradle -p android app:checkDebugAarMetadata --no-daemon

      - name: Maker Settings repository tests
        run: flutter test test/features/settings/maker_info_settings_repository_test.dart

      - name: Maker Settings widget tests
        run: flutter test test/features/settings/maker_info_settings_screen_test.dart

      - name: Maker Settings navigation test
        run: flutter test test/features/settings/maker_settings_navigation_test.dart

      - name: Appreciator Settings repository tests
        run: flutter test test/features/settings/appreciator_settings_repository_test.dart

      - name: Appreciator Settings modal tests
        run: flutter test test/features/settings/appreciator_settings_modal_test.dart

      - name: Appreciator Settings navigation integration
        run: flutter test test/features/settings/appreciator_settings_navigation_integration_test.dart

      - name: Artwork viewer visibility contract test
        run: flutter test test/features/settings/artwork_viewer_visibility_contract_test.dart

      - name: Artwork Discovery pagination and SVG UI contract
        run: flutter test test/features/discovery/maker_artwork_discovery_screen_test.dart

      - name: Saved Artwork repository tests
        run: flutter test test/features/saved_artworks/saved_artworks_repository_test.dart

      - name: Saved Artwork navigation and grid tests
        run: flutter test test/features/saved_artworks/maker_saved_artworks_screen_test.dart

      - name: Artwork Viewer saved-artwork regression
        run: flutter test test/features/artwork_viewer/artwork_viewer_screen_test.dart

      - name: Prior Search Filter regression
        run: flutter test test/features/discovery/discovery_filter_screen_test.dart

      - name: Prior Discovery regression
        run: flutter test test/features/discovery/maker_artwork_discovery_screen_test.dart

      - name: Experience switching repository tests
        run: flutter test test/features/auth/experience_switch_repository_test.dart

      - name: Prior Auth regression
        run: flutter test test/features/auth/maker_entry_repository_test.dart

      - name: Onboarding validation unit tests
        run: flutter test test/features/onboarding/onboarding_validators_test.dart

      - name: Prior Onboarding regression
        run: flutter test test/features/onboarding/maker_registration_backend_submission_test.dart

      - name: Onboarding keyboard and spacing regression
        run: flutter test test/features/onboarding/maker_registration_flow_test.dart test/features/onboarding/appreciator_registration_flow_test.dart

      - name: Appreciator onboarding regression
        run: flutter test test/features/onboarding/appreciator_registration_flow_test.dart test/features/onboarding/appreciator_registration_backend_submission_test.dart

      - name: Maker onboarding switching regression
        run: flutter test test/features/onboarding/maker_onboarding_repository_test.dart

      - name: Startup regression
        run: flutter test test/widget_test.dart

      - name: Full Flutter regression
        run: flutter test
