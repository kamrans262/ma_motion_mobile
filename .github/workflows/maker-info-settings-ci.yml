name: Maker Info Settings Mobile CI

on:
  push:
    branches:
      - ci/maker-info-settings
      - feature/maker-onboarding-ui-polish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout module branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Verify formatting is stable
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          if ! git diff --quiet -- lib test; then
            echo "=== FORMATTED_ONBOARDING_SCAFFOLD_BEGIN ==="
            cat lib/features/onboarding/presentation/widgets/ma_onboarding_scaffold.dart
            echo "=== FORMATTED_ONBOARDING_SCAFFOLD_END ==="
            echo "=== FORMATTED_ONBOARDING_TEST_BEGIN ==="
            cat test/features/onboarding/maker_registration_flow_test.dart
            echo "=== FORMATTED_ONBOARDING_TEST_END ==="
            exit 1
          fi

      - name: Flutter analyzer
        run: flutter analyze

      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Android dependency metadata gate
        run: gradle -p android app:checkDebugAarMetadata --no-daemon

      - name: Maker Settings repository tests
        run: flutter test test/features/settings/maker_info_settings_repository_test.dart

      - name: Maker Settings widget tests
        run: flutter test test/features/settings/maker_info_settings_screen_test.dart

      - name: Maker Settings navigation test
        run: flutter test test/features/settings/maker_settings_navigation_test.dart

      - name: Artwork viewer visibility contract test
        run: flutter test test/features/settings/artwork_viewer_visibility_contract_test.dart

      - name: Artwork Discovery pagination and SVG UI contract
        run: flutter test test/features/discovery/maker_artwork_discovery_screen_test.dart

      - name: Saved Artwork repository tests
        run: flutter test test/features/saved_artworks/saved_artworks_repository_test.dart

      - name: Saved Artwork navigation and grid tests
        run: flutter test test/features/saved_artworks/maker_saved_artworks_screen_test.dart

      - name: Artwork Viewer saved-artwork regression
        run: flutter test test/features/artwork_viewer/artwork_viewer_screen_test.dart

      - name: Prior Search Filter regression
        run: flutter test test/features/discovery/discovery_filter_screen_test.dart

      - name: Prior Discovery regression
        run: flutter test test/features/discovery/maker_artwork_discovery_screen_test.dart

      - name: Prior Auth regression
        run: flutter test test/features/auth/maker_entry_repository_test.dart

      - name: Prior Onboarding regression
        run: flutter test test/features/onboarding/maker_registration_backend_submission_test.dart

      - name: Startup regression
        run: flutter test test/widget_test.dart

      - name: Full Flutter regression
        run: flutter test
